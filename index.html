<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Externo - Simulação</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0070d2; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #005fb2; }
        .help { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Meu Sistema Externo</h2>
        <p>Simulação de integração com Salesforce</p>
        
        <label for="accountIdField">ID da Conta no Salesforce:</label>
        <input type="text" id="accountIdField" placeholder="Ex: 001XXXXXXXXXXXXXXX" value="">
        
        <button onclick="navigateToPortal()">Acessar Meus Contatos</button>
        
        <p class="help">O ID será convertido em Base64 e enviado via URL.</p>
    </div>

    <script>
        function navigateToPortal() {
            const accountId = document.getElementById('accountIdField').value;
            // ESTA CHAVE DEVE SER IGUAL À QUE VOCÊ SALVOU NO CUSTOM METADATA NO SALESFORCE
            const secretKey = "minha_chave_ultra_secreta_2026";
            const timestamp = Date.now();
            
            if (!accountId) {
                alert("Insira o ID da Conta");
                return;
            }
        
            // Gera o token no formato "001XXXXXXXXXXXX:minha_chave_ultra_secreta_2026"
            // E depois transforma tudo em Base64
            const rawTokenString = accountId + ":" + secretKey + ":" + timestamp;
            const encodedToken = btoa(rawTokenString);
            
            const portalUrl = "https://creative-otter-3dbvzj-dev-ed.trailblaze.my.site.com/portalaura/s/";
            window.location.href = portalUrl + "?token=" + encodedToken;
        }

    </script>

</body>
</html>
